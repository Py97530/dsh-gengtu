# dsh-gengtu bundle patch:host 插件(send_meme + learn_meme + /dsh-memes)
# 以及客户端设置页分区。安装:
#   dsh plugin --profile <profile> add dsh-gengtu
#
# 插件 id 仍为 dsh-expression —— 与上游 dsh-meme 保持一致,既有的脚本、提示词、
# 用户设置(~/.dsh/dsh-expression.json)全部继续有效。
# name 必须是实际包名(dsh-gengtu):cordis 按 name import 包,
# 写成 dsh-expression 会报 Cannot find package 'dsh-expression'。
#
# ⚠️ 不要和上游 dsh-meme 同时安装 —— 两个包抢同一个插件 id dsh-expression。
#
# 图库目录不在这里写死(上游踩过的坑:patch 里硬编码某台机器的 memeRoot,
# 别的用户装完指向不存在的目录,插件直接起不来)。
# 用户在设置页下拉切换图库,保存到 ~/.dsh/dsh-expression.json;
# 默认用包内置图库 memes/dafeiyu-001。
- insert:
    - id: dsh-expression
      name: dsh-gengtu
